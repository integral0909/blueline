[flake8]
max-line-length = 100
# A package that gathers names for the rest of the tree to import is doing
# exactly what F401 is complaining about.
per-file-ignores =
    __init__.py:F401
exclude = .git,__pycache__,.venv2018,migrations/versions

[mypy]
python_version = 3.7
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
ignore_missing_imports = True

[tool:pytest]
testpaths = tests
